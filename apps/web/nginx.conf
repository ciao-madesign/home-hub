server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Condivisione schermo (relay WebRTC, fuori roadmap): location dedicata
    # perché a differenza del resto di /api/ è un WebSocket di lunga durata,
    # non una singola richiesta HTTP — nginx non fa l'upgrade WS di
    # default, va richiesto esplicitamente. Più specifica di /api/ sotto,
    # quindi nginx la fa vincere per questo percorso (match più lungo).
    location /api/screenshare/ws {
        proxy_pass http://host.docker.internal:4000/api/screenshare/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Dopo l'handshake iniziale il socket resta aperto ma quasi muto
        # per tutta la sessione (il video passa come RTP/UDP diretto verso
        # l'Hub, non attraverso questo proxy) — il timeout di lettura di
        # nginx di default (60s) chiuderebbe una sessione ancora attiva.
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # L'Hub API è l'unico punto di accesso ai dati (§2/§14) — il frontend
    # statico parla con essa via reverse proxy, mai direttamente con i backend.
    # L'Hub API gira sull'host, non in un container (vedi docker-compose.yml
    # e docs/SPECIFICHE.md) — host.docker.internal la raggiunge da qui.
    location /api/ {
        proxy_pass http://host.docker.internal:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
