server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'Hub API è l'unico punto di accesso ai dati (§2/§14) — il frontend
    # statico parla con essa via reverse proxy, mai direttamente con i backend.
    # L'Hub API gira sull'host, non in un container (vedi docker-compose.yml
    # e docs/SPECIFICHE.md) — host.docker.internal la raggiunge da qui.
    location /api/ {
        proxy_pass http://host.docker.internal:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
