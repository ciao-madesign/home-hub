services:
  # L'Hub API NON è containerizzata: gira come servizio systemd direttamente
  # sull'host (vedi infra/systemd/home-hub-api.service e README.md "Deploy").
  # Motivo: il modulo Gaming deve avviare emulatori/Moonlight con accesso
  # diretto allo schermo e ai controller, cosa che un container isolato non
  # ha di norma — vedi docs/SPECIFICHE.md §2/§3 per il ragionamento completo.
  # Come effetto collaterale utile, anche Wake-on-LAN (broadcast UDP) e la
  # lettura di temperatura/CPU reali (§30) diventano più semplici senza
  # dover passare privilegi di rete/host al container.

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HUB_WEB_PORT:-80}:80"
    extra_hosts:
      # Permette a nginx di raggiungere l'Hub API sull'host (vedi apps/web/nginx.conf).
      - "host.docker.internal:host-gateway"
    networks: [hub]

  # Backend Film/Serie (§7).
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./data/Media/Movies:/media/movies:ro
      - ./data/Media/Series:/media/series:ro
      - ./data/Media/Music:/media/music:ro
    # Hardware video acceleration (§3/§7): richiede /dev/dri sull'host
    # (Intel J4105 del Dell Wyse 5070). Rimuovere se non disponibile.
    devices:
      - /dev/dri:/dev/dri
    networks: [hub]

  # Backend Foto/Video personali (§8). Richiede Postgres + Redis, a
  # differenza di Jellyfin che è self-contained.
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    ports:
      - "2283:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${HUB_IMMICH_DB_PASSWORD:-immich}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - ./data/Photos:/usr/src/app/upload
    depends_on:
      - immich-db
      - immich-redis
    networks: [hub]

  # Rilevamento volti/oggetti: disabilitato di default — pesante per
  # l'hardware iniziale (Intel J4105, 8 GB RAM, §3). Va abilitato solo su
  # hardware più potente, impostando anche IMMICH_MACHINE_LEARNING_URL
  # sul servizio immich-server.
  # immich-machine-learning:
  #   image: ghcr.io/immich-app/immich-machine-learning:release
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/immich/model-cache:/cache
  #   networks: [hub]

  immich-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [hub]

  immich-db:
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${HUB_IMMICH_DB_PASSWORD:-immich}
      POSTGRES_DB: immich
    volumes:
      - ./data/immich/db:/var/lib/postgresql/data
    networks: [hub]

  # Accesso remoto HTTPS (§22-24), opzionale e disattivato di default:
  # avviare con `docker compose --profile remote-https up -d`, e prima
  # impostare HUB_PUBLIC_DOMAIN (es. da DDNS, vedi apps/api/.env.example)
  # e HUB_ACME_EMAIL in infra/.env. Caddy ottiene/rinnova da solo un
  # certificato Let's Encrypt e instrada solo l'HTTPS pubblico (443)
  # verso "web" — l'accesso LAN su HUB_WEB_PORT resta invariato, nessun
  # conflitto di porta. Pubblica solo 443 (non 80) di proposito: forza la
  # verifica TLS-ALPN-01, che non richiede aprire anche la 80 sul router.
  #
  # IMPORTANTE (sicurezza): non inoltrare MAI la porta 80/HUB_WEB_PORT dal
  # router verso questa macchina, solo la 443 verso Caddy. "web" (nginx)
  # instrada l'intero /api/ senza distinguere LAN da Internet, e alcuni
  # endpoint (selezione profilo, wizard di primo avvio) non richiedono
  # password apposta per la LAN (§21) — raggiungibili da Internet
  # permetterebbero un accesso admin completo senza password. Il
  # Caddyfile blocca già quei percorsi per la via ufficiale (Caddy), ma
  # quel blocco non esiste su nginx: se la 80 finisse esposta lo
  # aggirerebbe. Vedi la revisione di sicurezza in docs/SPECIFICHE.md.
  #
  # Non verificato contro Let's Encrypt reale in questo ambiente (nessun
  # dominio pubblico/router reale disponibile) — vedi docs/SPECIFICHE.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["remote-https"]
    ports:
      - "443:443"
    environment:
      HUB_PUBLIC_DOMAIN: ${HUB_PUBLIC_DOMAIN:?imposta HUB_PUBLIC_DOMAIN in infra/.env}
      HUB_ACME_EMAIL: ${HUB_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web
    networks: [hub]

networks:
  hub:
