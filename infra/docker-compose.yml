services:
  # L'Hub API NON è containerizzata: gira come servizio systemd direttamente
  # sull'host (vedi infra/systemd/home-hub-api.service e README.md "Deploy").
  # Motivo: il modulo Gaming deve avviare emulatori/Moonlight con accesso
  # diretto allo schermo e ai controller, cosa che un container isolato non
  # ha di norma — vedi docs/SPECIFICHE.md §2/§3 per il ragionamento completo.
  # Come effetto collaterale utile, anche Wake-on-LAN (broadcast UDP) e la
  # lettura di temperatura/CPU reali (§30) diventano più semplici senza
  # dover passare privilegi di rete/host al container.

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HUB_WEB_PORT:-80}:80"
    extra_hosts:
      # Permette a nginx di raggiungere l'Hub API sull'host (vedi apps/web/nginx.conf).
      - "host.docker.internal:host-gateway"
    networks: [hub]

  # Blocco pubblicità/tracker a livello DNS (fuori roadmap, richiesta
  # esplicita dell'utente — vedi docs/EXTERNAL_TOOLS.md per la
  # motivazione). Non parla con l'Hub API: è un servizio indipendente,
  # come Jellyfin/Immich. Sempre attivo (nessun profilo): non fa nulla
  # finché nessun dispositivo lo usa come DNS, quindi non c'è motivo di
  # tenerlo opt-in come i servizi di accesso remoto.
  #
  # IMPORTANTE: sulla porta 53 spesso c'è già `systemd-resolved` in
  # ascolto sul Wyse (comune su Ubuntu) — verifica con
  # `sudo ss -tulpn | grep :53` prima del primo avvio; se occupata,
  # disabilita lo stub listener di systemd-resolved (vedi README
  # "Deploy" per il comando) invece di cambiare la porta qui, altrimenti
  # i dispositivi che puntano al DNS standard (53) non lo raggiungono.
  adguard:
    image: adguard/adguardhome:latest
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # Pannello di amministrazione — porta diversa da 80/443, già usate
      # da web/Caddy. Al primo avvio guida un setup wizard (utente admin,
      # eventuale cambio porta) su questo stesso indirizzo.
      - "${HUB_ADGUARD_ADMIN_PORT:-3001}:3000"
    volumes:
      - ./data/adguard/conf:/opt/adguardhome/conf
      - ./data/adguard/work:/opt/adguardhome/work
    networks: [hub]

  # Backend Film/Serie (§7).
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./data/Media/Movies:/media/movies:ro
      - ./data/Media/Series:/media/series:ro
    # Hardware video acceleration (§3/§7): richiede /dev/dri sull'host
    # (Intel J4105 del Dell Wyse 5070). Rimuovere se non disponibile.
    devices:
      - /dev/dri:/dev/dri
    networks: [hub]

  # Backend Foto/Video personali (§8). Richiede Postgres + Redis, a
  # differenza di Jellyfin che è self-contained.
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    ports:
      - "2283:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${HUB_IMMICH_DB_PASSWORD:-immich}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
    volumes:
      - ./data/Photos:/usr/src/app/upload
    depends_on:
      - immich-db
      - immich-redis
    networks: [hub]

  # Rilevamento volti/oggetti: disabilitato di default — pesante per
  # l'hardware iniziale (Intel J4105, 8 GB RAM, §3). Va abilitato solo su
  # hardware più potente, impostando anche IMMICH_MACHINE_LEARNING_URL
  # sul servizio immich-server.
  # immich-machine-learning:
  #   image: ghcr.io/immich-app/immich-machine-learning:release
  #   restart: unless-stopped
  #   volumes:
  #     - ./data/immich/model-cache:/cache
  #   networks: [hub]

  immich-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [hub]

  immich-db:
    # Immagine ufficiale Immich (non pgvecto-rs generico): le versioni
    # recenti del server richiedono l'estensione "vchord" o "vector",
    # che pgvecto-rs non fornisce più sotto quel nome — scoperto sul
    # Wyse reale con immich-server in crash loop ("No vector extension
    # found"), vedi docs/SPECIFICHE.md §5.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${HUB_IMMICH_DB_PASSWORD:-immich}
      POSTGRES_DB: immich
    volumes:
      - ./data/immich/db:/var/lib/postgresql/data
    networks: [hub]

  # Accesso remoto HTTPS (§22-24), opzionale e disattivato di default:
  # avviare con `docker compose --profile remote-https up -d`, e prima
  # impostare HUB_PUBLIC_DOMAIN (es. da DDNS, vedi apps/api/.env.example)
  # e HUB_ACME_EMAIL in infra/.env. Caddy ottiene/rinnova da solo un
  # certificato Let's Encrypt e instrada solo l'HTTPS pubblico (443)
  # verso "web" — l'accesso LAN su HUB_WEB_PORT resta invariato, nessun
  # conflitto di porta. Pubblica solo 443 (non 80) di proposito: forza la
  # verifica TLS-ALPN-01, che non richiede aprire anche la 80 sul router.
  #
  # IMPORTANTE (sicurezza): non inoltrare MAI la porta 80/HUB_WEB_PORT dal
  # router verso questa macchina, solo la 443 verso Caddy. "web" (nginx)
  # instrada l'intero /api/ senza distinguere LAN da Internet, e alcuni
  # endpoint (selezione profilo, wizard di primo avvio) non richiedono
  # password apposta per la LAN (§21) — raggiungibili da Internet
  # permetterebbero un accesso admin completo senza password. Il
  # Caddyfile blocca già quei percorsi per la via ufficiale (Caddy), ma
  # quel blocco non esiste su nginx: se la 80 finisse esposta lo
  # aggirerebbe. Vedi la revisione di sicurezza in docs/SPECIFICHE.md.
  #
  # Non verificato contro Let's Encrypt reale in questo ambiente (nessun
  # dominio pubblico/router reale disponibile) — vedi docs/SPECIFICHE.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["remote-https"]
    ports:
      - "443:443"
    environment:
      # NON ${VAR:?messaggio}: quella sintassi viene valutata per l'intero
      # file ad ogni `docker compose` qualunque profilo sia attivo (bug
      # reale trovato qui: rompeva anche jellyfin/immich per chi non
      # aveva ancora configurato l'accesso remoto) — con un default vuoto
      # invece il file resta valido sempre, e Caddy fallisce solo se
      # questo servizio viene davvero avviato senza il dominio impostato
      # (visibile con `docker compose logs caddy`).
      HUB_PUBLIC_DOMAIN: ${HUB_PUBLIC_DOMAIN:-}
      HUB_ACME_EMAIL: ${HUB_ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web
    networks: [hub]

  # Tunnel di fallback GRATUITO (§23, proposta aperta chiusa in
  # docs/SPECIFICHE.md) per chi non può aprire porte sul router — es.
  # CGNAT, probabile con l'ISP dell'utente (EOLO, un operatore FWA, vedi
  # §3): Cloudflare Tunnel stabilisce una connessione IN USCITA
  # dall'Hub verso Cloudflare, niente da inoltrare sul router. Sempre
  # gratuito per questo uso (nessun piano a pagamento richiesto).
  #
  # Attivare con `docker compose --profile remote-tunnel up -d`. Due
  # modalità, scelte da sole in base a HUB_CLOUDFLARE_TUNNEL_TOKEN:
  #
  # - Senza token (default, "Quick Tunnel"): nessun account Cloudflare
  #   richiesto, cloudflared genera da solo un indirizzo pubblico
  #   temporaneo tipo https://parole-casuali.trycloudflare.com, stampato
  #   nei suoi log (`docker compose logs cloudflared`) — cambia se il
  #   container si riavvia. Il modo più semplice per iniziare.
  # - Con token (tunnel con nome, dominio stabile): crea un tunnel
  #   gratuito su https://one.dash.cloudflare.com (Zero Trust → Networks
  #   → Tunnels → "Create a tunnel") e imposta
  #   HUB_CLOUDFLARE_TUNNEL_TOKEN in infra/.env — vedi README "Deploy".
  #   Nel pannello del tunnel, il "Public Hostname" va configurato con
  #   service "http://caddy-tunnel:8080" (non "web:80" direttamente,
  #   vedi sotto).
  #
  # Alternativa a Caddy con dominio pubblico + porta 443 aperta (sopra):
  # usa questo profilo invece di "remote-https" quando il port forwarding
  # non è un'opzione (es. CGNAT). I due profili possono anche convivere.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["remote-tunnel"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$TUNNEL_TOKEN" ]; then
          exec cloudflared tunnel run
        else
          exec cloudflared tunnel --no-autoupdate --url http://caddy-tunnel:8080
        fi
    environment:
      # Default vuoto invece di ${VAR:?...}: senza token si passa da soli
      # alla modalità Quick Tunnel sopra, invece di rompere l'intero
      # docker-compose.yml o fallire con un errore di autenticazione.
      TUNNEL_TOKEN: ${HUB_CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy-tunnel
    networks: [hub]

  # IMPORTANTE (sicurezza): cloudflared punta qui, MAI direttamente a
  # "web" — stessa barriera di sicurezza del Caddy per HTTPS sopra
  # (blocco di /api/profiles*/api/setup/*, vedi Caddyfile.tunnel),
  # altrimenti chiunque conosca l'URL del tunnel otterrebbe accesso admin
  # completo senza password (stesso bug di sicurezza già corretto per la
  # via HTTPS, vedi docs/SPECIFICHE.md). Nessuna porta pubblicata
  # sull'host: raggiungibile solo da cloudflared, sulla stessa rete
  # Docker interna — Cloudflare termina già il TLS al proprio edge, non
  # serve un certificato qui.
  caddy-tunnel:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["remote-tunnel"]
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
    networks: [hub]

networks:
  hub:
