services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      HUB_API_PORT: "4000"
      HUB_API_HOST: "0.0.0.0"
      HUB_DB_PATH: /data/hub/hub.sqlite
      HUB_DATA_ROOT: /data
      HUB_DISK_CRITICAL_FREE_PERCENT: "10"
      HUB_CORS_ORIGINS: ${HUB_CORS_ORIGINS:-http://localhost}
      HUB_JELLYFIN_URL: http://jellyfin:8096/health
      HUB_JELLYFIN_BASE_URL: http://jellyfin:8096
      # Da creare in Jellyfin dopo il setup: Dashboard → API Keys.
      HUB_JELLYFIN_API_KEY: ${HUB_JELLYFIN_API_KEY:-}
    volumes:
      - ./data:/data
    networks: [hub]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HUB_WEB_PORT:-80}:80"
    depends_on:
      - api
    networks: [hub]

  # Backend Film/Serie (§7). Foto/Video personali (Immich, §8) verranno
  # aggiunti in Fase 5 successiva, come da docs/SPEC_V1.md §39.
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./data/Media/Movies:/media/movies:ro
      - ./data/Media/Series:/media/series:ro
      - ./data/Media/Music:/media/music:ro
    # Hardware video acceleration (§3/§7): richiede /dev/dri sull'host
    # (Intel J4105 del Dell Wyse 5070). Rimuovere se non disponibile.
    devices:
      - /dev/dri:/dev/dri
    networks: [hub]

networks:
  hub:
